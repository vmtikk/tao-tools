- name: reference_btc_usd
  version: 2
  definition: >
    Volume-weighted composite BTC/USD close price per 1-minute bucket, across
    every BTC/USD- and BTC/USDT-quoted reference venue present in
    silver.ohlcv_1m (USDT treated as USD-equivalent, same as
    price_composite_usd). Not a chart — this is the BTC/USD leg the
    cross-rate sanity check (§4.1) uses to verify price_composite_usd ÷
    reference_btc_usd tracks price_composite_btc.
  params: {}
  depends_on: []
  export: false
  sql: >
    SELECT
      timestamp_ms,
      SUM(close * quote_volume) / SUM(quote_volume) AS value
    FROM silver_ohlcv_1m
    WHERE quote_volume > 0 AND pair IN ('BTCUSD', 'BTCUSDT')
    GROUP BY timestamp_ms
    ORDER BY timestamp_ms
  changelog:
    - v1: "initial (Phase 1.3), Kraken BTC/USD only"
    - v2: "widened to BTCUSDT (Binance) — found 2026-09-10 that Kraken's BTC/USD, like its TAO pairs, only serves a live-tail window via its public OHLC endpoint (no real 2023-onward history); Binance's BTC/USDT has full deep history, same as its TAO/USDT. Kraken is kept too — its thin recent data doesn't hurt anything."

- name: volume_usd_daily
  version: 2
  definition: >
    Binance TAO/USDT quote volume in USD, summed per UTC day.
    Binance-only, deliberately — not a composite across every polled venue.
    Found real (2026-09-10): venues came online at very different points
    (Binance 2024-04, Coinbase 2025-03, OKX 2026-06, MEXC 2026-08, Kraken
    live-tail-only), so a multi-venue sum jumps every time a new venue's
    history starts, not because trading activity actually changed — a day
    with 1 contributing venue sits right next to a day with 4, making the
    series internally incomparable across time. Binance is the only venue
    with volume for the whole window, so restricting to it trades completeness
    (misses real volume on Coinbase/OKX/MEXC once they're live) for a series
    that's actually comparable day to day — undercounting consistently is
    more useful here than a total that means something different every year.
  params: {}
  depends_on: []
  sql: >
    SELECT
      (timestamp_ms // 86400000) * 86400000 AS timestamp_ms,
      SUM(quote_volume) AS value
    FROM silver_ohlcv_1m
    WHERE quote_volume > 0 AND exchange = 'binance' AND pair = 'TAOUSDT'
    GROUP BY 1
    ORDER BY 1
  changelog:
    - v1: initial (Phase 1.4)
    - v2: "restricted to Binance only (was: summed across every USD/USDT venue present). Found 2026-09-10: with real backfill history in place, venues started at very different dates, so the multi-venue sum jumped every time a new venue's history began — not a real activity change, just more venues contributing. Binance has continuous history back to 2024-04-11 (the earliest any venue has TAO data at all), so restricting to it makes every point in the series comparable to every other, at the cost of undercounting once Coinbase/OKX/MEXC are also trading."

- name: transfer_count_daily
  version: 2
  definition: >
    Count of Balances.Transfer events per UTC day, over whatever block range is
    currently in silver.transfers. Requires chain bronze; absent in a Phase 1-only
    environment (see materializeGold's guard on silver_transfers).
  params: {}
  depends_on: []
  sql: >
    SELECT
      (timestamp_ms // 86400000) * 86400000 AS timestamp_ms,
      COUNT(*) AS value
    FROM silver_transfers
    GROUP BY 1
    ORDER BY 1
  changelog:
    - v1: "initial (Phase 2.1) as transfer_count_per_block, one point per exact block timestamp — fine for the ~1,000-block Phase 2.1 tracer bullet, but found for real (2026-09-05) to produce 1.3M points against the real ~5.8M-block backfill prefix, which a browser cannot render (1.3M SVG bars) or even receive quickly (~200MB page, ~40s load)"
    - v2: "renamed to transfer_count_daily and rebucketed to UTC days, matching every other time-series metric in this registry (volume_usd_daily, account_balances_daily, wallet_count_*, exchange_balances_daily) — per-block resolution was never meaningful past a few thousand blocks anyway, since a chart can only show as many distinct columns as it has pixels"

- name: account_balances_daily
  version: 2
  definition: >
    Per-coldkey free balance (rao) at the end of each UTC day, one row per
    (coldkey, day) that had at least one balance-affecting event that day —
    NOT forward-filled to every calendar day (§7.1: "reconstruct balances
    locally for every day", but density here is bounded by activity, not by
    the full days x coldkeys cross product, which is intractable at
    real chain scale — see wallet_count_* for how the sparse form gets
    turned into a continuous daily series without materializing that cross
    product). Folds silver_transfers (signed +/- to the two legs) and
    silver_balance_events (deposit=+, withdraw=-) into one signed delta
    stream per coldkey, sums those deltas per (coldkey, UTC day), then
    running-sums the daily totals in day order. End-of-day balance is by
    definition the cumulative sum of every delta up to and including that
    day, so aggregating per day before the running sum gives the same
    answer as folding event by event. Internal base table, not a chart —
    see wallet_count_*.
  params: {}
  depends_on: []
  export: false
  # Every window below partitions by coldkey, so one coldkey's balance never
  # depends on another's — the runner computes this a hash-bucket of coldkeys
  # at a time (bounded memory, real progress, resumable) instead of sorting
  # all ~440M delta rows in one pass. See MetricEntrySchema's shard_by.
  shard_by: coldkey
  sql: >
    WITH deltas AS (
      SELECT from_coldkey AS coldkey, block_number, event_index, timestamp_ms, -amount_rao AS delta_rao
      FROM silver_transfers
      UNION ALL
      SELECT to_coldkey AS coldkey, block_number, event_index, timestamp_ms, amount_rao AS delta_rao
      FROM silver_transfers
      UNION ALL
      SELECT coldkey, block_number, event_index, timestamp_ms,
             CASE kind WHEN 'deposit' THEN amount_rao ELSE -amount_rao END AS delta_rao
      FROM silver_balance_events
    ),
    daily AS (
      SELECT coldkey,
             (timestamp_ms // 86400000) * 86400000 AS day_ms,
             SUM(delta_rao) AS day_delta_rao
      FROM deltas
      GROUP BY coldkey, day_ms
    )
    SELECT coldkey, day_ms AS timestamp_ms,
           SUM(day_delta_rao) OVER (
             PARTITION BY coldkey ORDER BY day_ms
             ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
           ) AS balance_rao
    FROM daily
    ORDER BY coldkey, timestamp_ms
  changelog:
    - v1: initial (Phase 3.1)
    - v2: >
        Aggregate deltas per (coldkey, day) before the running sum instead of
        running-summing every event and keeping the last row of each day.
        Fixes a correctness bug and removes the pipeline's worst bottleneck.
        Correctness: a transfer contributes two delta rows sharing one
        (block_number, event_index), so a self-transfer puts both legs in the
        same coldkey's partition with identical sort keys, and v1's
        "ROW_NUMBER() ... ORDER BY block_number DESC, event_index DESC" then
        broke that tie arbitrarily — picking a running sum that had applied
        one leg but not the other and reporting a balance off by the transfer
        amount, non-deterministically. Found 2026-09-09 on real data (103
        self-transfers across 44 coldkeys; one was wrong by exactly 90000000
        rao). Summing a day's deltas is tie-free. Performance: v1 sorted all
        ~440M delta rows to compute a per-event running sum it then discarded
        all but one row per day of. One pallet-derived account holds ~44% of
        all transfer legs (~91M rows) and cannot be split across shards, so
        its single partition ran 4+ hours without finishing; under v2 it
        collapses to ~91 daily rows and completes in ~3s.

- name: wallet_count_free_balance
  version: 1
  definition: >
    Daily count of distinct coldkeys with free balance > 0 (§7.1 series 1) —
    includes dust and airdrop noise, unlike wallet_count_dust_filtered.
    Coldkeys only, never hotkeys (§7.1's critical distinction, enforced
    upstream by account_balances_daily reading only coldkey-branded columns).
    Detects each coldkey's balance>0 <-> not crossing from the sparse
    account_balances_daily rows (a crossing can only happen on a row that
    exists there), turns those crossings into a running count, then carries
    that count forward across every day in range — including days with no
    crossings at all — via a gaps-and-islands forward-fill (last non-null
    value carried across each run of NULLs), so the series is continuous day
    over day rather than only defined on days something changed.
  params: {}
  depends_on: [account_balances_daily]
  sql: >
    WITH indicator AS (
      SELECT coldkey, timestamp_ms, CASE WHEN balance_rao > 0 THEN 1 ELSE 0 END AS ind
      FROM account_balances_daily
    ),
    transitions AS (
      SELECT coldkey, timestamp_ms, ind,
             LAG(ind, 1, 0) OVER (PARTITION BY coldkey ORDER BY timestamp_ms) AS prev_ind
      FROM indicator
    ),
    day_deltas AS (
      SELECT timestamp_ms, SUM(ind - prev_ind) AS delta
      FROM transitions
      WHERE ind <> prev_ind
      GROUP BY timestamp_ms
    ),
    running_count AS (
      SELECT timestamp_ms, SUM(delta) OVER (ORDER BY timestamp_ms) AS value
      FROM day_deltas
    ),
    day_spine AS (
      -- Bounded by the full account_balances_daily date range (via
      -- `indicator`), not by running_count's crossing days — a day whose
      -- only activity doesn't happen to cross *this* threshold (e.g. a
      -- dust-level withdrawal against the > 0.01 TAO series) must still
      -- appear in the spine so the forward-fill carries the count through
      -- it, instead of the series silently truncating at the last crossing.
      SELECT UNNEST(generate_series(
        (SELECT MIN(timestamp_ms) FROM indicator),
        (SELECT MAX(timestamp_ms) FROM indicator),
        86400000
      )) AS timestamp_ms
    ),
    joined AS (
      SELECT ds.timestamp_ms, rc.value
      FROM day_spine ds
      LEFT JOIN running_count rc ON rc.timestamp_ms = ds.timestamp_ms
    ),
    filled AS (
      SELECT timestamp_ms, value,
             SUM(CASE WHEN value IS NOT NULL THEN 1 ELSE 0 END) OVER (
               ORDER BY timestamp_ms ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
             ) AS grp
      FROM joined
    )
    SELECT timestamp_ms, MAX(value) OVER (PARTITION BY grp) AS value
    FROM filled
    ORDER BY timestamp_ms
  changelog:
    - v1: initial (Phase 3.1)

- name: wallet_count_dust_filtered
  version: 1
  definition: >
    Daily count of distinct coldkeys with free balance > 0.01 TAO (§7.1
    series 3) — strips airdrop and dust noise out of wallet_count_free_balance.
    Same crossing-detection + forward-fill method as wallet_count_free_balance,
    just against a 10,000,000 rao (0.01 TAO) threshold instead of > 0.
  params:
    dust_threshold_rao: 10000000
  depends_on: [account_balances_daily]
  sql: >
    WITH indicator AS (
      SELECT coldkey, timestamp_ms, CASE WHEN balance_rao > 10000000 THEN 1 ELSE 0 END AS ind
      FROM account_balances_daily
    ),
    transitions AS (
      SELECT coldkey, timestamp_ms, ind,
             LAG(ind, 1, 0) OVER (PARTITION BY coldkey ORDER BY timestamp_ms) AS prev_ind
      FROM indicator
    ),
    day_deltas AS (
      SELECT timestamp_ms, SUM(ind - prev_ind) AS delta
      FROM transitions
      WHERE ind <> prev_ind
      GROUP BY timestamp_ms
    ),
    running_count AS (
      SELECT timestamp_ms, SUM(delta) OVER (ORDER BY timestamp_ms) AS value
      FROM day_deltas
    ),
    day_spine AS (
      -- Bounded by the full account_balances_daily date range (via
      -- `indicator`), not by running_count's crossing days — a day whose
      -- only activity doesn't happen to cross *this* threshold (e.g. a
      -- dust-level withdrawal against the > 0.01 TAO series) must still
      -- appear in the spine so the forward-fill carries the count through
      -- it, instead of the series silently truncating at the last crossing.
      SELECT UNNEST(generate_series(
        (SELECT MIN(timestamp_ms) FROM indicator),
        (SELECT MAX(timestamp_ms) FROM indicator),
        86400000
      )) AS timestamp_ms
    ),
    joined AS (
      SELECT ds.timestamp_ms, rc.value
      FROM day_spine ds
      LEFT JOIN running_count rc ON rc.timestamp_ms = ds.timestamp_ms
    ),
    filled AS (
      SELECT timestamp_ms, value,
             SUM(CASE WHEN value IS NOT NULL THEN 1 ELSE 0 END) OVER (
               ORDER BY timestamp_ms ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
             ) AS grp
      FROM joined
    )
    SELECT timestamp_ms, MAX(value) OVER (PARTITION BY grp) AS value
    FROM filled
    ORDER BY timestamp_ms
  changelog:
    - v1: initial (Phase 3.1)

- name: exchange_balances_daily
  version: 1
  definition: >
    "TAO on exchanges" (§7.2) — total free balance, in TAO (not rao), held across every coldkey in
    data/meta/exchange_labels.json, per UTC day, forward-filled across the full account_balances_daily
    date range (unlike wallet_count_*, this sums real balances for a small fixed set of ~10 labeled
    coldkeys rather than counting 232K+ coldkeys, so a dense per-coldkey day spine is cheap here — no
    need for the crossing-detection trick). A labeled coldkey with no activity yet in the currently
    decoded prefix contributes 0, not an assumed balance. Independent of every other chart (§1) — can
    ship or slip without blocking anything. Labels are Taostats-sourced only so far (medium
    confidence, see future-work.md) and Taobridge (a bridge, not an exchange) is deliberately excluded
    from exchange_labels.json, not filtered here. KNOWN GAP, confirmed against real data
    2026-09-05 (tao-analytics-plan.md's Phase 3.1 entry): account_balances_daily has no genesis
    baseline, so a labeled coldkey funded before block 1 with no Deposit event ever recorded for it
    can make this go negative for real — not clamped, since that would hide the signal that the
    underlying fold is missing a real on-chain balance read. Do not treat this series as trustworthy
    until chain:reconcile-checkpoints has actually run clean.
  params: {}
  depends_on: [account_balances_daily]
  sql: >
    WITH exchange_balances AS (
      SELECT a.coldkey, a.timestamp_ms, a.balance_rao
      FROM account_balances_daily a
      JOIN exchange_labels e ON e.coldkey = a.coldkey
    ),
    day_spine AS (
      SELECT UNNEST(generate_series(
        (SELECT MIN(timestamp_ms) FROM account_balances_daily),
        (SELECT MAX(timestamp_ms) FROM account_balances_daily),
        86400000
      )) AS timestamp_ms
    ),
    coldkey_day_spine AS (
      SELECT ds.timestamp_ms, e.coldkey
      FROM day_spine ds
      CROSS JOIN (SELECT DISTINCT coldkey FROM exchange_labels) e
    ),
    joined AS (
      SELECT cs.coldkey, cs.timestamp_ms, b.balance_rao
      FROM coldkey_day_spine cs
      LEFT JOIN exchange_balances b ON b.coldkey = cs.coldkey AND b.timestamp_ms = cs.timestamp_ms
    ),
    filled AS (
      SELECT coldkey, timestamp_ms, balance_rao,
             SUM(CASE WHEN balance_rao IS NOT NULL THEN 1 ELSE 0 END) OVER (
               PARTITION BY coldkey ORDER BY timestamp_ms ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
             ) AS grp
      FROM joined
    ),
    forward_filled AS (
      SELECT coldkey, timestamp_ms, MAX(balance_rao) OVER (PARTITION BY coldkey, grp) AS balance_rao
      FROM filled
    )
    SELECT timestamp_ms, SUM(COALESCE(balance_rao, 0)) / 1e9 AS value
    FROM forward_filled
    GROUP BY timestamp_ms
    ORDER BY timestamp_ms
  changelog:
    - v1: initial (Phase 3.3)
