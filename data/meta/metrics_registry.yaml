    labeling requirement — it applies here too).
  params: {}
  depends_on: [price_composite_btc]
  sql: >
    SELECT
      (timestamp_ms // 86400000) * 86400000 AS timestamp_ms,
      arg_max(value, timestamp_ms) AS value
    FROM price_composite_btc
    GROUP BY 1
    ORDER BY 1
  changelog:
    - v1: "initial (2026-09-10) — see price_composite_btc's v3 changelog for why"

- name: price_composite_btc_weekly
