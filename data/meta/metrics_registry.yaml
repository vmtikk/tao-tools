# Metric registry (tao-analytics-plan.md §8). One entry per gold metric,
# loaded through the Zod schema in packages/core/src/registry/schema.ts so a
# malformed entry fails at startup with a line number, not mid-materialization.
#
# Changing `sql` or `params` without bumping `version` will fail the golden
# gold.json snapshot test in packages/pipeline/test — that's the enforcement
# mechanism, not a convention to remember.

- name: price_composite_usd
  version: 3
  definition: >
    Volume-weighted composite TAO/USD close price per 1-minute bucket, across
    every USD- and USDT-quoted venue present in silver.ohlcv_1m (USDT is
    treated as USD-equivalent per §4.1). A bucket with zero quote volume on
    every venue is excluded, not weighted as zero. INTERNAL — not shipped in
    gold.json; see price_composite_usd_daily for the chart.
  params: {}
  depends_on: []
  export: false
  sql: >
    SELECT
      timestamp_ms,
      SUM(close * quote_volume) / SUM(quote_volume) AS value
    FROM silver_ohlcv_1m
    WHERE quote_volume > 0 AND pair IN ('TAOUSD', 'TAOUSDT')
    GROUP BY timestamp_ms
    ORDER BY timestamp_ms
  changelog:
    - v1: initial, Kraken-only (Phase 0)
    - v2: widened to every USD/USDT venue (Phase 1.1); USDT pairs folded into the USD composite
    - v3: "stopped shipping in gold.json (export: false). Found 2026-09-10: once real backfill history landed, this metric alone produced 1,268,539 points — a 960px chart plotting an SVG path with one command per point, plus a linear hover-scan over all of them, plus (if toggled) a table with 1.27M rows. gold.json hit 248MB. Kept materializing internally (still needed for price_composite_btc's join and any future per-minute join, e.g. Phase 4 cost basis) — see price_composite_usd_daily, the new chart-facing metric."

- name: price_composite_usd_daily
  version: 1
  definition: >
    Daily close of price_composite_usd — the last 1-minute composite value
    observed each UTC day. What the TAO/USD chart actually renders; the
    1-minute series stays internal (see price_composite_usd's v3 changelog).
    At most ~1,000 points for the full history so far, matching a chart's
    actual pixel width instead of a 1.27M-point SVG path.
  params: {}
  depends_on: [price_composite_usd]
  sql: >
    SELECT
      (timestamp_ms // 86400000) * 86400000 AS timestamp_ms,
      arg_max(value, timestamp_ms) AS value
    FROM price_composite_usd
    GROUP BY 1
    ORDER BY 1
  changelog:
    - v1: "initial (2026-09-10) — see price_composite_usd's v3 changelog for why"

- name: price_composite_usd_weekly
  version: 1
  definition: >
    Weekly close of price_composite_usd_daily — the last daily close observed
    in each Monday-aligned UTC week. Bucketed with pure integer arithmetic
    anchored to a known Monday
    (`((timestamp_ms + 3 days) // 7 days) * 7 days - 3 days`), not DuckDB's
    date_trunc('week', ...) — found for real (2026-09-10) that date_trunc
    truncates in the DuckDB session's *local* timezone, not UTC (it defaults
    to the machine's system timezone unless explicitly overridden), which
    would silently shift week boundaries depending on where materializeGold
    runs. Built from the daily rollup, not the raw 1-minute composite —
    cheaper, and taking the last day's close within a week is the same value
    either way. For a viewer who only cares about days/weeks (not 1-minute or
    hourly detail), the same 883 daily points already render weekly trends
    visually with no extra work; this exists for a UI that wants fewer,
    explicitly-weekly points instead.
  params: {}
  depends_on: [price_composite_usd_daily]
  sql: >
    SELECT
      (((timestamp_ms + 259200000) // 604800000) * 604800000) - 259200000 AS timestamp_ms,
      arg_max(value, timestamp_ms) AS value
    FROM price_composite_usd_daily
    GROUP BY 1
    ORDER BY 1
  changelog:
    - v1: "initial (2026-09-10), alongside price_composite_btc_weekly — requested for a days/weeks-focused view now that 1-minute/hourly resolution is confirmed unnecessary"

- name: price_composite_btc
  version: 3
  definition: >
    IMPLIED TAO/BTC price per 1-minute bucket — price_composite_usd ÷
    reference_btc_usd, not a directly-traded market price. No exchange lists
    a real, continuously-tradable TAO/BTC pair (confirmed 2026-09-10: Kraken's
    market list has no TAO/BTC symbol at all; Upbit returns zero candles even
    for a recent `since`, no error). This is a synthetic cross rate
    constructed from two already-real composites, the same way a trader would
    price an illiquid cross by routing through a common quote currency.
    Always label this "implied" wherever it's shown — never present it as an
    observed price (same labeling discipline as chart 5's "estimated cost
    basis," never "MVRV" — plan §7.3). INTERNAL — not shipped in gold.json;
    see price_composite_btc_daily for the chart.
  params: {}
  depends_on: [price_composite_usd, reference_btc_usd]
  export: false
  sql: >
    SELECT
      price_composite_usd.timestamp_ms,
      price_composite_usd.value / reference_btc_usd.value AS value
    FROM price_composite_usd
    JOIN reference_btc_usd ON reference_btc_usd.timestamp_ms = price_composite_usd.timestamp_ms
    WHERE reference_btc_usd.value != 0
    ORDER BY price_composite_usd.timestamp_ms
  changelog:
    - v1: "initial (Phase 1.3) — direct composite across Kraken and Upbit's TAO/BTC markets"
    - v2: "redefined as an implied cross-rate (price_composite_usd / reference_btc_usd). Found 2026-09-10, after a real venue investigation: no reputable exchange lists a real TAO/BTC pair at all (Kraken has no such market; Upbit returns zero candles) — BTC_VENUES (ingest/exchanges/venues.ts) is empty and expected to stay that way. This also retires pipeline:cross-rate-check's original purpose: it compared price_composite_btc against price_composite_usd/reference_btc_usd as an independent check, and those are now the same value by construction, so the check can no longer flag anything — see crossRateCheck.query.test.ts's updated comment."
    - v3: "stopped shipping in gold.json (export: false), same reason and same day as price_composite_usd's v3 — this metric mirrors price_composite_usd's row count exactly (it's a join against it), so it was equally oversized. See price_composite_btc_daily."

